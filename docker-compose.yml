version: '3.8'

services:
  envguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: envguard-app
    environment:
      - PORT=8080
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=10m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 32M
    networks:
      - caddy_proxy

networks:
  caddy_proxy:
    external: true

