version: '3.8'

services:
  envguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: envguard-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=10m
    security_opt:
      - no-new-privileges:true
